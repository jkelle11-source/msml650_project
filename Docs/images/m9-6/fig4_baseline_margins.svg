   <g id="text_23">
    <text style="font-weight: 700; font-size: 14.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="28.8" y="36.167168" transform="rotate(-0 28.8 36.167168)">The classifier catches 99.9% of faults, the simple rule only 47%</text>
   </g>
   <g id="text_24">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="28.8" y="412.998047" transform="rotate(-0 28.8 412.998047)">Simple rule: flags a window when any service's p95 latency is above 2x its normal level or its 5xx share is above 5%, compared with the mean of the 3 earlier windows.</text>
   </g>
   <g id="text_25">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="28.8" y="433.158047" transform="rotate(-0 28.8 433.158047)">The weaker version of the rule compares with the previous window only. Differences are paired by run.</text>
   </g>
