  <g id="text_18">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.2 435.387041)">Projection from M9-1's measured unit costs, 30 incidents a month, 730 hours a month. Both axes logarithmic. List price: the always-free allowance</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.2 447.989912)">is not subtracted.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.2 460.592783)">Orange: the monitored store alone. Blue: what AnomalyPulse adds. The cost has a fixed part, so it grows more slowly than traffic.</text>
  </g>
