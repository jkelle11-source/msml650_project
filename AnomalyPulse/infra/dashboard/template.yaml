AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  AnomalyPulse dashboard (M7-2, M8-5) - the read API the SRE console polls: GET /dashboard
  returns the object in Docs/DASHBOARD_CONTRACT.md. A stack of its own:
  anomalypulse-shared is not redeployed until M9-1. Serves live data (M8-5): the newest
  minute's health and the open incident from the Incidents table (anomalypulse-pipeline's),
  and the run's manifest from the telemetry bucket. DashboardSource=mock serves the
  contract's mock scenarios instead.

Parameters:
  DashboardSource:
    Type: String
    Default: live
    AllowedValues:
      - live
      - mock
    Description: >-
      live (M8-5) reads the Incidents table and the telemetry bucket; mock serves the contract's
      scenarios (?scenario=). To go back to mock: sam deploy --parameter-overrides DashboardSource=mock
  IncidentsTableName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /anomalypulse/tables/incidents/name
    Description: The pipeline stack's Incidents table, read from its SSM parameter.
  TelemetryBucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /anomalypulse/telemetry/bucket/name
    Description: The shared stack's telemetry bucket, read from its SSM parameter.

Resources:

  # ---- Dashboard Lambda ---------------------------------------
  # Builds the reply (dashboard/handler.py, live_source.py). Its role reads only: GetItem and
  # Query on the Incidents table's HEALTH and INCIDENT partitions (the window builder's health
  # item and the incident store's records), and the runs' manifests in the telemetry bucket.
  # ListBucket on the bucket lets S3 answer NoSuchKey for a missing manifest (no ground truth)
  # instead of AccessDenied, which the live source treats as a failure. The handler answers 503
  # for anything but DASHBOARD_SOURCE "mock" or "live", and for a live read that fails: never
  # mock data in place of live.

  DashboardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-dashboard
      RetentionInDays: 90

  DashboardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: anomalypulse-dashboard
      Description: The AnomalyPulse dashboard read API runs as this role (M7-2, M8-5)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: dashboard-incidents-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IncidentsTableName}'
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - HEALTH
                      - INCIDENT
                  'Null':
                    dynamodb:LeadingKeys: 'false'
        - PolicyName: dashboard-manifest-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${TelemetryBucketName}'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${TelemetryBucketName}/experiments/*/manifest.json'

  DashboardFunction:
    Type: AWS::Serverless::Function
    # dashboard/Makefile bundles the read API with incidents/record.py and the genai modules it imports,
    # for M8-5's live source (Docs/INCIDENT_FEED.md).
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: anomalypulse-dashboard
      CodeUri: ../../dashboard
      Handler: handler.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt DashboardRole.Arn
      LoggingConfig:
        LogGroup: !Ref DashboardLogGroup
      Environment:
        Variables:
          DASHBOARD_SOURCE: !Ref DashboardSource
          INCIDENTS_TABLE: !Ref IncidentsTableName
          TELEMETRY_BUCKET: !Ref TelemetryBucketName
      Events:
        GetDashboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref DashboardApi
            Path: /dashboard
            Method: GET

  # ---- Dashboard API ---------------------------------------
  # An HTTP API (cheaper and simpler than the shared stack's REST API; no API key).
  # CORS: a page in a browser may read a reply from another address only if the
  # API names the page's address. With live data (M8-5), only the console's two
  # addresses (DASHBOARD_CONTRACT.md, open question 1): it runs from the presenting
  # laptop, not from AWS. With CORS set here, API Gateway answers the browser itself
  # and ignores any CORS headers from the function. The console polls every 15 s;
  # the throttle leaves room for many open pages and stops a runaway loop from
  # running up calls.

  DashboardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - http://127.0.0.1:4173
          - http://localhost:4173
        AllowMethods:
          - GET
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # ---- SSM Parameters ---------------------------------------
  # For the console's config and M8.

  SsmDashboardUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/dashboard/url
      Type: String
      Value: !Sub 'https://${DashboardApi}.execute-api.${AWS::Region}.amazonaws.com/dashboard'

Outputs:
  DashboardUrl:
    Description: GET it for the dashboard object (live; with DashboardSource=mock, add ?scenario=<name>)
    Value: !Sub 'https://${DashboardApi}.execute-api.${AWS::Region}.amazonaws.com/dashboard'
