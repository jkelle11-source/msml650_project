version = 0.1

[default.deploy.parameters]
stack_name = "anomalypulse-incidents"
resolve_s3 = true
s3_prefix = "anomalypulse-incidents"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_NAMED_IAM"

[default.global.parameters]
region = "us-east-2"

# The Makefile reads incidents/, genai/ and ml/diagnosis/ from the repository (it finds the
# repository with git), so it runs in its source folder instead of a copy.
[default.build.parameters]
build_in_source = true