AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AnomalyPulse shared infrastructure - API skeleton (M1-1)

Resources:

  # ---- Shared API Gateway (M1-1) ---------------------------------------
  # The one REST API everyone's service attaches to (the "building" in the
  # handoff; each route is a "room"). Owned by this shared stack only.
  # Teammates never edit this - they attach their routes from their own
  # stack by looking up its ID in SSM (see /anomalypulse/api/rest-api-id).

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: anomalypulse-api
      StageName: dev
  
  # ---- Catch-all 501 stub (M1-1) ---------------------------------------
  # Answers every route with 501 NOT_IMPLEMENTED until a real service is
  # wired. Mapped to /{proxy+} ANY - a greedy wildcard. When a teammate
  # attaches a specific route (e.g. GET /products), API Gateway prefers the
  # more specific match, so their route wins and everything else still 501s.

  StubFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-stub-501
      Runtime: python3.12
      Handler: index.handler
      Timeout: 5
      InlineCode: |
        import json
        def handler(event, context):
          return {
            'statusCode': 501,
            'headers': {'Content-Type': 'application/json'},
            'body': json.dumps({'data': None,
                                'error': {'code': 'NOT_IMPLEMENTED',
                                          'message': 'Route not yet wired'}}),       
          }
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /{proxy+}
            Method: ANY
  
  # ---- DynamoDB tables (M1-1) ------------------------------------------
  # Only KEY attributes are declared. Everything else (name, price, items,
  # status, ...) is schemaless and written by the service Lambdas later.
  # Billing mode is on-demand (PAY_PER_REQUEST): zero idle cost, no capacity
  # to size. NOTE (M3): the DynamoDB-throttling incident needs a table in
  # PROVISIONED mode with low RCU/WCU to produce *real* throttling. Revisit
  # the Products table then; PAY_PER_REQUEST is correct for M1.

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties: 
      TableName: anomalypulse-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH         # HASH = partition key
  
  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-carts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: item_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH         # partition key: one user...
        - AttributeName: item_id
          KeyType: RANGE        # RANGE = sort key: ... many items
  
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema: 
        - AttributeName: order_id
          KeyType: HASH
  
  # ---- Per-service IAM roles (M1-1) ------------------------------------
  # Each role = a trust policy (only Lambda may assume it) + the AWS-managed
  # basic-execution policy (CloudWatch Logs; required because we set Role:
  # explicitly, so SAM won't add it) + a tight inline policy scoped to just
  # that service's table. ARNs are published to SSM in step 4.

  ProductRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies: 
        - PolicyName: product-dynamodb-read
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource: !GetAtt ProductsTable.Arn
  
  CartRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cart-dynamodb-readwrite
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt CartsTable.Arn
    
  OrderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: 
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: order-dynamodb-readwrite
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt OrdersTable.Arn
        - PolicyName: order-invoke-payment
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:anomalypulse-payment'
  
  PaymentRole: 
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  
  # ---- Published config: API address book (M1-1) -----------------------
  # The shared API's URL and IDs, published to SSM so teammates look them
  # up by a fixed path instead of hardcoding values that change on redeploy.
  # base-url: full invoke URL 
  # rest-api-id: what a service stack attaches to
  # root-resource-id: the API's root resource (some setups need it).

  SsmApiUrl: 
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/api/base-url
      Type: String
      Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
  
  SsmApiId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/api/rest-api-id
      Type: String
      Value: !Ref RestApi

  SsmRootRes:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/api/root-resource-id
      Type: String
      Value: !GetAtt RestApi.RootResourceId
  
  # ---- Published config: table names + role ARNs (M1-1) ----------------
  # The "address book". Teammates look these up by path instead of
  # hardcoding. Table params publish the NAME (boto3 addresses tables by
  # name); role params publish the ARN (a function's Role: wants an ARN).

  SsmProductsTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/products/name
      Type: String
      Value: !Ref ProductsTable       # Ref on a DynamoDB table = its name
  
  SsmCartsTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/carts/name
      Type: String 
      Value: !Ref CartsTable

  SsmOrdersTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/orders/name
      Type: String
      Value: !Ref OrdersTable
  
  SsmProductRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/iam/product-role-arn
      Type: String
      Value: !GetAtt ProductRole.Arn   # GetAtt ...Arn = the role's ARN
  
  SsmCartRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/iam/cart-role-arn
      Type: String
      Value: !GetAtt CartRole.Arn
  
  SsmOrderRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/iam/order-role-arn
      Type: String
      Value: !GetAtt OrderRole.Arn

  SsmPaymentRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/iam/payment-role-arn 
      Type: String
      Value: !GetAtt PaymentRole.Arn