AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AnomalyPulse shared infrastructure - API skeleton (M1-1)

Globals:
  Function:
    Architectures:
      - arm64
    Layers: 
      - !Ref TelemetryLayer

Resources:

  # ---- Shared API Gateway ---------------------------------------

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: anomalypulse-api
      StageName: dev
      # CORS for the browser-based dashboard (Section 14). Narrow 
      # AllowOrigin to the dashboard origin later.
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
  
  TelemetryLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: anomalypulse-telemetry
      ContentUri: ../../layers/telemetry
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
    Metadata:
      BuildMethod: makefile
  
  # ---- Telemetry Landing Zone ---------------------------------------

  TelemetryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'anomalypulse-telemetry-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption: 
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules: 
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-telemetry
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 90
          - Id: expire-metrics-telemetry
            Status: Enabled
            Prefix: metrics/
            ExpirationInDays: 90
  
  # ---- CloudWatch Log Groups ---------------------------------------

  ProductLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-product
      RetentionInDays: 90
      
  CartLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-cart
      RetentionInDays: 90
  
  OrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-order
      RetentionInDays: 90
  
  PaymentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-payment
      RetentionInDays: 90

  # ---- Lambda Functions ---------------------------------------

  ProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-product
      CodeUri: ../../services/product/
      Handler: handler.handler            # file handler.py, function handler()
      Runtime: python3.13
      Timeout: 10
      Role: !GetAtt ProductRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductsTable
      Events:
        ListProducts:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products
            Method: GET
        GetProduct:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products/{id}
            Method: GET
    
  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-cart
      CodeUri: ../../services/cart/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 10
      Role: !GetAtt CartRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref CartsTable
      Events: 
        PostCart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /cart
            Method: POST
        GetCart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /cart/{user}
            Method: GET
        DeleteCart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /cart/{user}/{item}
            Method: DELETE
  
  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-order
      CodeUri: ../../services/order/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 10
      Role: !GetAtt OrderRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          USE_PAYMENT_STUB: 'false'
          PAYMENT_FUNCTION_NAME: !Ref PaymentFunction
      Events:
        PostOrder:
          Type: Api
          Properties: 
            RestApiId: !Ref RestApi
            Path: /orders
            Method: POST
        GetOrder:
          Type: Api
          Properties: 
            RestApiId: !Ref RestApi
            Path: /orders/{id}
            Method: GET
  
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-payment
      CodeUri: ../../services/payment/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 10
      Role: !GetAtt PaymentRole.Arn
      Environment:
        Variables:
          PAYMENT_LATENCY_MS: '0'
          PAYMENT_FAILURE_RATE: '0.0'
          PAYMENT_TIMEOUT: 'false'
      Events:
        PostPayment:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /payments
            Method: POST

  ShipperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-telemetry-shipper
      CodeUri: ./shipper/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 30
      Role: !GetAtt ShipperRole.Arn
      Environment: 
        Variables:
          BUCKET_NAME: !Ref TelemetryBucket
  
  MetricsExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-metrics-extractor
      CodeUri: ./metrics_extractor/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 30
      Role: !GetAtt MetricsExtractorRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref TelemetryBucket
          METRICS_LAG_MINUTES: '2'
          MONITORED_TABLES: !Sub 'product-service=${ProductsTable},cart-service=${CartsTable},order-service=${OrdersTable}'
          MONITORED_FUNCTIONS: !Sub 'product-service=${ProductFunction},cart-service=${CartFunction},order-service=${OrderFunction},payment-service=${PaymentFunction}'
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
          
  # ---- Catch-all 501 Stub ---------------------------------------
  # This stub is mapped to /{proxy+} ANY - a greedy wildcard that API Gateway
  # prefers least, so it catches only paths matching no defined route and 
  # answers them with 501 NOT_IMPLEMENTED. A defined route always wins over it.

  StubFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-stub-501
      Runtime: python3.13
      Handler: index.handler
      Timeout: 5
      InlineCode: |
        import json
        def handler(event, context):
          return {
            'statusCode': 501,
            'headers': {'Content-Type': 'application/json'},
            'body': json.dumps({'data': None,
                                'error': {'code': 'NOT_IMPLEMENTED',
                                          'message': 'Route not yet wired'}}),       
          }
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /{proxy+}
            Method: ANY
  
  # ---- DynamoDB Tables ---------------------------------------
  # NOTE (M3): the DynamoDB-throttling incident needs a table in
  # PROVISIONED mode with low RCU/WCU to produce *real* throttling. Revisit
  # the Products table then; PAY_PER_REQUEST is correct for M1.

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties: 
      TableName: anomalypulse-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH         # HASH = partition key
  
  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-carts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: item_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH         # partition key: one user...
        - AttributeName: item_id
          KeyType: RANGE        # RANGE = sort key: ... many items
  
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema: 
        - AttributeName: order_id
          KeyType: HASH
  
  # ---- Per-service IAM Roles ----------------------------------------

  ProductRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies: 
        - PolicyName: product-dynamodb-read
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource: !GetAtt ProductsTable.Arn
  
  CartRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cart-dynamodb-readwrite
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt CartsTable.Arn
    
  OrderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: 
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: order-dynamodb-readwrite
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt OrdersTable.Arn
        - PolicyName: order-invoke-payment
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:anomalypulse-payment'
  
  PaymentRole: 
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  
  ShipperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: 
          - Effect: Allow
            Principal: 
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: shipper-s3-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: 
                  - !Sub '${TelemetryBucket.Arn}/raw/*'
                  - !Sub '${TelemetryBucket.Arn}/errors/*'
  
  MetricsExtractorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: 
          - Effect: Allow
            Principal: 
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: metrics-extractor-cloudwatch-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: cloudwatch:GetMetricStatistics
                Resource: '*'
        - PolicyName: metrics-extractor-s3-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${TelemetryBucket.Arn}/metrics/*'
  
  # ---- Invoke Permissions ---------------------------------------

  ShipperInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: 
      FunctionName: !Ref ShipperFunction
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/anomalypulse-*:*'

  # ---- Subscription Filters ---------------------------------------

  ProductSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ShipperInvokePermission
    Properties:
      LogGroupName: !Ref ProductLogGroup
      DestinationArn: !GetAtt ShipperFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'
  
  CartSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ShipperInvokePermission
    Properties:
      LogGroupName: !Ref CartLogGroup
      DestinationArn: !GetAtt ShipperFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'
  
  PaymentSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ShipperInvokePermission
    Properties:
      LogGroupName: !Ref PaymentLogGroup
      DestinationArn: !GetAtt ShipperFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'
  
  OrderSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ShipperInvokePermission
    Properties:
      LogGroupName: !Ref OrderLogGroup
      DestinationArn: !GetAtt ShipperFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'

  # ---- SSM Parameters ---------------------------------------

  SsmApiUrl: 
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/api/base-url
      Type: String
      Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
  
  SsmApiId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/api/rest-api-id
      Type: String
      Value: !Ref RestApi
  
  SsmBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/telemetry/bucket/name
      Type: String
      Value: !Ref TelemetryBucket

  SsmProductsTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/products/name
      Type: String
      Value: !Ref ProductsTable
  
  SsmCartsTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/carts/name
      Type: String 
      Value: !Ref CartsTable

  SsmOrdersTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/orders/name
      Type: String
      Value: !Ref OrdersTable