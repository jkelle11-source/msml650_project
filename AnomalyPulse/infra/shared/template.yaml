AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AnomalyPulse shared infrastructure - API skeleton (M1-1)

Globals:
  Function:
    Architectures:
      - arm64
    # One full vCPU (Lambda gives CPU in proportion to memory; 1769 MB = 1
    # vCPU). At the 128 MB default a function measured ~6% of a vCPU (M3-2
    # validation), so CPU-bound work ran ~16x slower than its CPU time: a
    # Lambda-degradation fault of +X ms of CPU took ~16X of wall time and timed
    # out above ~620 ms, and every request held its concurrency slot ~3x longer
    # than its telemetry showed. Changing this changes every latency and
    # duration feature, so it must not change during dataset generation (M4).
    MemorySize: 1769
    # Lambda updates a managed runtime (Python patch release, bundled boto3) on
    # its own unless told otherwise, and FunctionUpdate would still move it
    # whenever a deploy touches a function. boto3's retry behaviour is part of
    # what a throttled request looks like, so the runtime is pinned to one
    # version: the one every function ran when M4 began (2026-10-16, read in
    # us-east-2). Only changing this ARN changes it; nobody does while M4 and M9
    # generate the dataset.
    RuntimeManagementConfig:
      UpdateRuntimeOn: Manual
      RuntimeVersionArn: arn:aws:lambda:us-east-2::runtime:0aacb188d2c5b3aad9e30760eeca867126ff27643ac0b027e44a1f156beaf2d8
    Layers:
      - !Ref TelemetryLayer

Resources:

  # ---- Shared API Gateway ---------------------------------------

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: anomalypulse-api
      StageName: dev
      # CORS for the browser-based dashboard (Section 14). Narrow 
      # AllowOrigin to the dashboard origin later.
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
  
  TelemetryLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: anomalypulse-telemetry
      ContentUri: ../../layers/telemetry
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
    Metadata:
      BuildMethod: makefile
  
  # ---- Telemetry Landing Zone ---------------------------------------

  TelemetryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'anomalypulse-telemetry-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption: 
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules: 
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-telemetry
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 90
          - Id: expire-metrics-telemetry
            Status: Enabled
            Prefix: metrics/
            ExpirationInDays: 90
  
  # ---- CloudWatch Log Groups ---------------------------------------

  ProductLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-product
      RetentionInDays: 90
      
  CartLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-cart
      RetentionInDays: 90
  
  OrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-order
      RetentionInDays: 90
  
  PaymentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-payment
      RetentionInDays: 90

  # ---- Lambda Functions ---------------------------------------

  ProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-product
      CodeUri: ../../services/product/
      Handler: handler.handler            # file handler.py, function handler()
      Runtime: python3.13
      Timeout: 10
      Role: !GetAtt ProductRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductsTable
          FAULT_CONFIG_TABLE: !Ref FaultConfigTable
      Events:
        ListProducts:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products
            Method: GET
        GetProduct:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products/{id}
            Method: GET
    
  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-cart
      CodeUri: ../../services/cart/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 10
      Role: !GetAtt CartRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref CartsTable
          FAULT_CONFIG_TABLE: !Ref FaultConfigTable
      Events: 
        PostCart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /cart
            Method: POST
        GetCart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /cart/{user}
            Method: GET
        DeleteCart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /cart/{user}/{item}
            Method: DELETE
  
  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-order
      CodeUri: ../../services/order/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 10
      Role: !GetAtt OrderRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          USE_PAYMENT_STUB: 'false'
          PAYMENT_FUNCTION_NAME: !Ref PaymentFunction
          FAULT_CONFIG_TABLE: !Ref FaultConfigTable
      Events:
        PostOrder:
          Type: Api
          Properties: 
            RestApiId: !Ref RestApi
            Path: /orders
            Method: POST
        GetOrder:
          Type: Api
          Properties: 
            RestApiId: !Ref RestApi
            Path: /orders/{id}
            Method: GET
  
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-payment
      CodeUri: ../../services/payment/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 10
      Role: !GetAtt PaymentRole.Arn
      Environment:
        Variables:
          # Faults come from this table (M3 control plane), not environment
          # variables: changing a variable recycles every warm environment.
          FAULT_CONFIG_TABLE: !Ref FaultConfigTable
      Events:
        PostPayment:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /payments
            Method: POST

  ShipperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-telemetry-shipper
      CodeUri: ./shipper/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 30
      Role: !GetAtt ShipperRole.Arn
      Environment: 
        Variables:
          BUCKET_NAME: !Ref TelemetryBucket
  
  MetricsExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-metrics-extractor
      CodeUri: ./metrics_extractor/
      Handler: handler.handler
      Runtime: python3.13
      Timeout: 30
      Role: !GetAtt MetricsExtractorRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref TelemetryBucket
          METRICS_LAG_MINUTES: '2'
          MONITORED_TABLES: !Sub 'product-service=${ProductsTable},cart-service=${CartsTable},order-service=${OrdersTable}'
          MONITORED_FUNCTIONS: !Sub 'product-service=${ProductFunction},cart-service=${CartFunction},order-service=${OrderFunction},payment-service=${PaymentFunction}'
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
          
  # ---- Catch-all 501 Stub ---------------------------------------
  # This stub is mapped to /{proxy+} ANY - a greedy wildcard that API Gateway
  # prefers least, so it catches only paths matching no defined route and 
  # answers them with 501 NOT_IMPLEMENTED. A defined route always wins over it.

  StubFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-stub-501
      Runtime: python3.13
      Handler: index.handler
      Timeout: 5
      InlineCode: |
        import json
        def handler(event, context):
          return {
            'statusCode': 501,
            'headers': {'Content-Type': 'application/json'},
            'body': json.dumps({'data': None,
                                'error': {'code': 'NOT_IMPLEMENTED',
                                          'message': 'Route not yet wired'}}),       
          }
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /{proxy+}
            Method: ANY
  
  # ---- DynamoDB Tables ---------------------------------------

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Created PROVISIONED, never switched. A Scan (GET /products) costs a
      # minimum per partition, and a table's partitions depend on its history:
      # the same 1.5 KB of products cost 0.5 RCU per scan in a table created
      # provisioned, 2.0 in one created on-demand, and 4.0 once that was
      # switched to provisioned (M3-3, 2026-10-15). The old anomalypulse-products
      # had that history, so this is a new table. Don't switch its billing mode
      # or raise its capacity during M4: either can add partitions and change
      # every GET /products' read cost mid-dataset.
      TableName: anomalypulse-products-v2
      # Fixed capacity, so the DB-throttling injector (M3-3) can drive real
      # throttling at a controlled offered-load-to-capacity ratio. At 0.5 RCU
      # per request, a 10x traffic spike reads ~75 RCU/s, about a third of 200,
      # so spikes don't throttle on their own. Docs/DB_THROTTLING_INJECTOR.md
      # has the sizing and cost (~$0.70/day). Delete the table after M9.
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 200
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH         # HASH = partition key
  
  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-carts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: item_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH         # partition key: one user...
        - AttributeName: item_id
          KeyType: RANGE        # RANGE = sort key: ... many items
  
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema: 
        - AttributeName: order_id
          KeyType: HASH
  
  ExperimentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-experiments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: 
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
  
  # Fault-injection control plane (M3-1). The simulator writes one item per
  # fault activation; each service Lambda queries its own partition and applies
  # any fault whose time window covers "now". Kept apart from ExperimentsTable 
  # so service roles never touch the lock.

  FaultConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-fault-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: service
          AttributeType: S
        - AttributeName: fault_id
          AttributeType: S
      KeySchema:
        - AttributeName: service
          KeyType: HASH           # which lambda applies the fault
        - AttributeName: fault_id
          KeyType: RANGE          # one item per fault activation
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  
  # ---- Per-service IAM Roles ----------------------------------------

  ProductRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies: 
        - PolicyName: product-dynamodb-read
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource: !GetAtt ProductsTable.Arn
        - PolicyName: product-fault-config-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt FaultConfigTable.Arn
  
  CartRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cart-dynamodb-readwrite
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt CartsTable.Arn
        - PolicyName: cart-fault-config-read
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt FaultConfigTable.Arn
    
  OrderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: 
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: order-dynamodb-readwrite
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt OrdersTable.Arn
        - PolicyName: order-invoke-payment
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:anomalypulse-payment'
        - PolicyName: order-fault-config-read
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt FaultConfigTable.Arn

  PaymentRole: 
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: payment-fault-config-read
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt FaultConfigTable.Arn
  
  ShipperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: 
          - Effect: Allow
            Principal: 
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: shipper-s3-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: 
                  - !Sub '${TelemetryBucket.Arn}/raw/*'
                  - !Sub '${TelemetryBucket.Arn}/errors/*'
  
  MetricsExtractorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: 
          - Effect: Allow
            Principal: 
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: metrics-extractor-cloudwatch-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                # ListMetrics finds the operations ThrottledRequests is
                # published under; CloudWatch has no table-wide total for it.
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'
        - PolicyName: metrics-extractor-s3-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${TelemetryBucket.Arn}/metrics/*'

  # ---- Simulator Role ---------------------------------------
  # Assumed by teammates to run the incident simulator (M3). It bounds what the
  # simulator process can touch; each injector's PR adds only what it needs.
  # Trust: the account root is the principal and the ArnLike condition narrows
  # it to sessions of the AnomalyPulseDeveloper permission set. Matching on the
  # name pattern (not the exact role ARN) survives the permission set's role
  # being re-created with a new random suffix. M4's runner host (M4-1,
  # infra/runner/template.yaml) assumes it too, through its instance role; the
  # condition names that role, so it can be trusted before it exists.

  SimulatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: anomalypulse-simulator
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/us-east-2/AWSReservedSSO_AnomalyPulseDeveloper_*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/anomalypulse-runner'
      Policies:
        - PolicyName: simulator-discovery
          PolicyDocument:
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/anomalypulse/*'
        - PolicyName: simulator-experiment-lock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt ExperimentsTable.Arn
        - PolicyName: simulator-fault-config-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt FaultConfigTable.Arn
        - PolicyName: simulator-manifest-readwrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${TelemetryBucket.Arn}/experiments/*'
        - PolicyName: simulator-db-throttling
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                # DescribeTable for the capacity, Scan for the item keys,
                # BatchGetItem for the load.
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource: !GetAtt ProductsTable.Arn
              - Effect: Allow
                # CloudWatch metric reads can't be scoped to a resource.
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'
        # M4's batch runner (M4-1, simulator/batch.py, Docs/DATASET.md). It
        # reads every function's configuration to check the stack is still
        # M4's, reads raw/ and metrics/ to export each run into the dataset,
        # and writes the dataset and its registry under datasets/. ListBucket
        # makes a missing key read as 404 rather than 403.
        - PolicyName: simulator-dataset-batch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:GetFunctionConfiguration
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:anomalypulse-*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt TelemetryBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${TelemetryBucket.Arn}/raw/*'
                  - !Sub '${TelemetryBucket.Arn}/metrics/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${TelemetryBucket.Arn}/datasets/*'


  # ---- Invoke Permissions ---------------------------------------

  ShipperInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: 
      FunctionName: !Ref ShipperFunction
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/anomalypulse-*:*'

  # ---- Subscription Filters ---------------------------------------

  ProductSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ShipperInvokePermission
    Properties:
      LogGroupName: !Ref ProductLogGroup
      DestinationArn: !GetAtt ShipperFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'
  
  CartSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ShipperInvokePermission
    Properties:
      LogGroupName: !Ref CartLogGroup
      DestinationArn: !GetAtt ShipperFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'
  
  PaymentSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ShipperInvokePermission
    Properties:
      LogGroupName: !Ref PaymentLogGroup
      DestinationArn: !GetAtt ShipperFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'
  
  OrderSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ShipperInvokePermission
    Properties:
      LogGroupName: !Ref OrderLogGroup
      DestinationArn: !GetAtt ShipperFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'

  # ---- SSM Parameters ---------------------------------------

  SsmApiUrl: 
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/api/base-url
      Type: String
      Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
  
  SsmApiId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/api/rest-api-id
      Type: String
      Value: !Ref RestApi
  
  SsmBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/telemetry/bucket/name
      Type: String
      Value: !Ref TelemetryBucket

  SsmProductsTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/products/name
      Type: String
      Value: !Ref ProductsTable
  
  SsmCartsTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/carts/name
      Type: String 
      Value: !Ref CartsTable

  SsmOrdersTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/orders/name
      Type: String
      Value: !Ref OrdersTable
  
  SsmExperimentsTableName:
    Type: AWS::SSM::Parameter
    Properties: 
      Name: /anomalypulse/tables/experiments/name
      Type: String
      Value: !Ref ExperimentsTable
  
  SsmFaultConfigTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/fault-config/name
      Type: String
      Value: !Ref FaultConfigTable
  
  SsmSimulatorRoleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/simulator/role-arn
      Type: String
      Value: !GetAtt SimulatorRole.Arn