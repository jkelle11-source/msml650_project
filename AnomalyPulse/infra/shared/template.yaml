AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AnomalyPulse shared infrastructure - API skeleton (M1-1)

Resources:

  # ---- Shared API Gateway (M1-1) ---------------------------------------

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: anomalypulse-api
      StageName: dev
  
  ProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-product
      CodeUri: ../../services/product/
      Handler: handler.handler            # file handler.py, function handler()
      Runtime: python3.12
      Timeout: 10
      Role: !GetAtt ProductRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductsTable
      Events:
        ListProducts:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products
            Method: GET
        GetProduct:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products/{id}
            Method: GET
    
  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-cart
      CodeUri: ../../services/cart/
      Handler: handler.handler        # file handler.py, function handler()
      Runtime: python3.12
      Timeout: 10
      Role: !GetAtt CartRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref CartsTable
      Events: 
        PostCart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /cart
            Method: POST
        GetCart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /cart/{user}
            Method: GET
        DeleteCart:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /cart/{user}/{item}
            Method: DELETE
  
  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-order
      CodeUri: ../../services/order/
      Handler: handler.handler          # file handler.py, function handler()
      Runtime: python3.12
      Timeout: 10
      Role: !GetAtt OrderRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Events:
        PostOrder:
          Type: Api
          Properties: 
            RestApiId: !Ref RestApi
            Path: /orders
            Method: POST
        GetOrder:
          Type: Api
          Properties: 
            RestApiId: !Ref RestApi
            Path: /orders/{id}
            Method: GET
  
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-payment
      CodeUri: ../../services/payment/
      Handler: handler.handler          # file handler.py, function handler()
      Runtime: python3.12
      Timeout: 10
      Role: !GetAtt PaymentRole.Arn
      Environment:
        Variables:
          PAYMENT_LATENCY_MS: '0'
          PAYMENT_FAILURE_RATE: '0.0'
          PAYMENT_TIMEOUT: 'false'
      Events:
        PostPayment:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /payments
            Method: POST
        
          
  # ---- Catch-all 501 stub (M1-1) ---------------------------------------
  # Every real route (/orders, /cart, etc.) is defined above in this stack. 
  # This stub is mapped to /{proxy+} ANY - a greedy wildcard that API Gateway
  # prefers least, so it catches only paths matching no defined route and 
  # answers them with 501 NOT_IMPLEMENTED. A defined route always wins over it.

  StubFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-stub-501
      Runtime: python3.12
      Handler: index.handler
      Timeout: 5
      InlineCode: |
        import json
        def handler(event, context):
          return {
            'statusCode': 501,
            'headers': {'Content-Type': 'application/json'},
            'body': json.dumps({'data': None,
                                'error': {'code': 'NOT_IMPLEMENTED',
                                          'message': 'Route not yet wired'}}),       
          }
      Events:
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /{proxy+}
            Method: ANY
  
  # ---- DynamoDB tables (M1-1) ------------------------------------------
  # Only KEY attributes are declared. Everything else (name, price, items,
  # status, ...) is schemaless and written by the service Lambdas later.
  # Billing mode is on-demand (PAY_PER_REQUEST): zero idle cost, no capacity
  # to size. NOTE (M3): the DynamoDB-throttling incident needs a table in
  # PROVISIONED mode with low RCU/WCU to produce *real* throttling. Revisit
  # the Products table then; PAY_PER_REQUEST is correct for M1.

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties: 
      TableName: anomalypulse-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH         # HASH = partition key
  
  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-carts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: item_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH         # partition key: one user...
        - AttributeName: item_id
          KeyType: RANGE        # RANGE = sort key: ... many items
  
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: anomalypulse-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema: 
        - AttributeName: order_id
          KeyType: HASH
  
  # ---- Per-service IAM roles (M1-1) ------------------------------------
  # Each role = a trust policy (only Lambda may assume it) + the AWS-managed
  # basic-execution policy (CloudWatch Logs; required because we set Role:
  # explicitly, so SAM won't add it) + a tight inline policy scoped to just
  # that service's table. ARNs are published to SSM in step 4.

  ProductRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies: 
        - PolicyName: product-dynamodb-read
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource: !GetAtt ProductsTable.Arn
  
  CartRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cart-dynamodb-readwrite
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt CartsTable.Arn
    
  OrderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: 
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: order-dynamodb-readwrite
          PolicyDocument: 
            Version: '2012-10-17'
            Statement: 
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt OrdersTable.Arn
        - PolicyName: order-invoke-payment
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:anomalypulse-payment'
  
  PaymentRole: 
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  
  # ---- Published config: API address book (M1-1) -----------------------
  # The shared API's URL and ID, published to SSM so later tooling looks 
  # them up by a fixed path instead of hardcoding values that change
  # on redeploy.
  # base-url: full invoke URL 
  # rest-api-id: what a service stack attaches to

  SsmApiUrl: 
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/api/base-url
      Type: String
      Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
  
  SsmApiId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/api/rest-api-id
      Type: String
      Value: !Ref RestApi
  
  # ---- Published config: table names  --------------------------------------
  # The "address book". Teammates look these up by path instead of hardcoding.

  SsmProductsTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/products/name
      Type: String
      Value: !Ref ProductsTable       # Ref on a DynamoDB table = its name
  
  SsmCartsTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/carts/name
      Type: String 
      Value: !Ref CartsTable

  SsmOrdersTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /anomalypulse/tables/orders/name
      Type: String
      Value: !Ref OrdersTable