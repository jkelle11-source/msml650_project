version = 0.1

[default.deploy.parameters]
stack_name = "anomalypulse-pipeline"
resolve_s3 = true
s3_prefix = "anomalypulse-pipeline"
region = "us-east-2"
confirm_changeset = true
capabilities = "CAPABILITY_NAMED_IAM"

[default.global.parameters]
region = "us-east-2"

# The window builder's Makefile reads features/ and simulator/ from the
# repository, so it runs in its source folder instead of a copy. The Python
# functions don't support this and build as before.
[default.build.parameters]
build_in_source = true
