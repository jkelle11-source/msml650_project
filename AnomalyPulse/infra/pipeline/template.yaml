AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  AnomalyPulse live telemetry pipeline (M8-1) - a second subscription filter on
  each service log group feeds a forwarder Lambda, then an EventBridge bus, an
  SQS queue and the Aggregator (Docs/PIPELINE.md). A stack of its own: the
  shipper keeps landing raw/ beside it, and anomalypulse-shared is not
  redeployed until M9-1.

Resources:

  # ---- Event Bus ---------------------------------------
  # The forwarder puts telemetry on it. From step 6 the Aggregator announces
  # each window on it too, and M8-2 adds its own rule for those.

  PipelineBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: anomalypulse-pipeline
  
  # ---- Queues ---------------------------------------
  # The telemetry queue holds every record between the bus and the Aggregator,
  # so a burst waits here instead of being lost; its backlog is the §16 number.

  TelemetryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: anomalypulse-telemetry
  
  # Telemetry that never reached the telemetry queue: events the rule couldn't
  # deliver and deliveries the forwarder failed 3 times. Kept 14 days (the most
  # SQS allows) to be read and sent again. Its alarm comes with the forwarder.

  UndeliveredQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: anomalypulse-telemetry-undelivered
      MessageRetentionPeriod: 1209600
  
  # ---- Routing ---------------------------------------
  # EventBridge retries a failed delivery for an hour, not its default 24: a
  # record that late can't help any live window, and in the undelivered queue
  # it's seen. Errors it can't retry (a missing permission, a missing queue)
  # go there at once.

  TelemetryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: anomalypulse-telemetry-to-queue
      EventBusName: !Ref PipelineBus
      EventPattern:
        source:
          - anomalypulse.telemetry
        detail-type:
          - TelemetryRecords
      Targets:
        - Id: telemetry-queue
          Arn: !GetAtt TelemetryQueue.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn: !GetAtt UndeliveredQueue.Arn
  
  # ---- Queue Policies ---------------------------------------
  # EventBridge may send to each queue only on behalf of our rule
  # (aws:SourceArn), so no other rule, in this account or another, can fill
  # them.

  TelemetryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref TelemetryQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: 
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt TelemetryQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt TelemetryRule.Arn
  
  UndeliveredQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref UndeliveredQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt UndeliveredQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt TelemetryRule.Arn
  
  # ---- Forwarder Lambda ---------------------------------------
  # Turns each subscription filter delivery into PutEvents calls, 100 records
  # an event (pipeline/forwarder/handler.py). CloudWatch Logs invokes it
  # asynchronously: a delivery the handler raises on is retried twice, then
  # sent to the undelivered queue. Like the rule, it gives up after an hour.

  ForwarderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anomalypulse-pipeline-forwarder
      RetentionInDays: 90
  
  # Only what the forwarder does: PutEvents on the pipeline bus, SendMessage to
  # the undelivered queue, and logs to its own log group. Not
  # AWSLambdaBasicExecutionRole, which may write to any log group, the
  # services' included, and those feed raw/ and this pipeline.

  ForwarderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: anomalypulse-pipeline-forwarder
      Description: The AnomalyPulse telemetry forwarder runs as this role (M8-1)
      AssumeRolePolicyDocument: 
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: forwarder-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ForwarderLogGroup.Arn
        - PolicyName: forwarder-put-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt PipelineBus.Arn
        - PolicyName: forwarder-on-failure
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt UndeliveredQueue.Arn
  
  ForwarderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anomalypulse-pipeline-forwarder
      CodeUri: ../../pipeline/forwarder
      Handler: handler.handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt ForwarderRole.Arn
      LoggingConfig:
        LogGroup: !Ref ForwarderLogGroup
      Environment:
        Variables:
          BUS_NAME: !Ref PipelineBus
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt UndeliveredQueue.Arn
  
  # ---- Alarm ---------------------------------------
  # In alarm while anything is in the undelivered queue: telemetry the
  # pipeline lost before the telemetry queue. No action: its state shows in
  # the CloudWatch console, and step 9's check reads it.

  UndeliveredAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: anomalypulse-telemetry-undelivered
      AlarmDescription: Telemetry is in anomalypulse-telemetry-undelivered; it never reached the telemetry queue (Docs/PIPELINE.md)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt UndeliveredQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
        
  # ---- Invoke Permissions ---------------------------------------
  # CloudWatch Logs may invoke the forwarder for the four service log groups
  # only, one permission each. The shipper's single permission covers
  # /aws/lambda/anomalypulse-*, which would also take in log groups that
  # aren't services', the forwarder's own among them.

  ProductInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ForwarderFunction
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/anomalypulse-product:*'

  CartInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ForwarderFunction
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/anomalypulse-cart:*'

  OrderInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ForwarderFunction
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/anomalypulse-order:*'

  PaymentInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ForwarderFunction
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/anomalypulse-payment:*'

  # ---- Subscription Filters ---------------------------------------
  # The second filter on each service log group (a log group allows two; the
  # shipper's is the first). The shipper's pattern, so the pipeline gets the
  # same lines raw/ does. The log groups are anomalypulse-shared's, named here
  # because that stack exports nothing. Each waits for its permission:
  # CloudWatch Logs checks it may invoke the forwarder when the filter is
  # created.

  ProductSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ProductInvokePermission
    Properties:
      FilterName: anomalypulse-pipeline
      LogGroupName: /aws/lambda/anomalypulse-product
      DestinationArn: !GetAtt ForwarderFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'
  
  CartSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: CartInvokePermission
    Properties:
      FilterName: anomalypulse-pipeline
      LogGroupName: /aws/lambda/anomalypulse-cart
      DestinationArn: !GetAtt ForwarderFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'

  OrderSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: OrderInvokePermission
    Properties:
      FilterName: anomalypulse-pipeline
      LogGroupName: /aws/lambda/anomalypulse-order
      DestinationArn: !GetAtt ForwarderFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'

  PaymentSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: PaymentInvokePermission
    Properties:
      FilterName: anomalypulse-pipeline
      LogGroupName: /aws/lambda/anomalypulse-payment
      DestinationArn: !GetAtt ForwarderFunction.Arn
      FilterPattern: '{ $.request_id = "*" }'
