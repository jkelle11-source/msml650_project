<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnomalyPulse status board</title>
  <meta name="description" content="Service health, the active incident, its AI diagnosis, and whether the model's prediction matches what was injected.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d2430'/%3E%3Cpath d='M4 17h6l3-8 6 15 3-7h6' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body data-state="loading">
  <header class="top">
    <p class="wordmark">AnomalyPulse</p>
    <div class="top-controls">
      <span id="updated"></span>
      <button id="pause" type="button" aria-pressed="false">Pause updates</button>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div id="demo" class="demo" hidden>
    <label for="scenario">Scenario</label>
    <select id="scenario"></select>
    <span id="source"></span>
  </div>

  <p id="notice" class="notice" role="alert" hidden></p>

  <main id="board">
    <section id="banner" class="banner" aria-live="polite">
      <span class="lamp" aria-hidden="true"></span>
      <div>
        <h1 id="banner-title"></h1>
        <ul id="banner-facts" class="facts"></ul>
      </div>
    </section>

    <dl id="kpis" class="kpis" aria-label="The latest minute"></dl>

    <section aria-labelledby="services-title">
      <h2 id="services-title">Service health</h2>
      <ul id="services" class="services"></ul>
    </section>

    <p id="all-clear" class="all-clear" hidden></p>

    <div id="incident-row" class="two-up">
      <section class="panel" aria-labelledby="incident-title">
        <h2 id="incident-title">Incident details</h2>
        <dl id="incident" class="details"></dl>
      </section>
      <section class="panel" aria-labelledby="diagnosis-title">
        <h2 id="diagnosis-title">AI diagnosis</h2>
        <div id="diagnosis"></div>
      </section>
    </div>

    <section id="check-section" class="panel check" aria-labelledby="check-title">
      <h2 id="check-title">Did the model get it right?</h2>
      <div id="check"></div>
    </section>
  </main>

  <noscript><p class="notice">The status board needs JavaScript to load its data.</p></noscript>
</body>
</html>
